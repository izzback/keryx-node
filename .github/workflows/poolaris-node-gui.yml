name: Poolaris Node GUI

on:
  push:
    branches:
      - poolaris-node-gui
    paths:
      - 'tools/poolaris-node-gui/**'
      - '.github/workflows/poolaris-node-gui.yml'
  pull_request:
    paths:
      - 'tools/poolaris-node-gui/**'
      - '.github/workflows/poolaris-node-gui.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tools/poolaris-node-gui/Poolaris.NodeGui.csproj

      - name: Build
        run: dotnet build tools/poolaris-node-gui/Poolaris.NodeGui.csproj -c Release --no-restore

      - name: Publish win-x64
        run: dotnet publish tools/poolaris-node-gui/Poolaris.NodeGui.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/poolaris-node-gui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poolaris-Node-GUI-win-x64
          path: artifacts/poolaris-node-gui
