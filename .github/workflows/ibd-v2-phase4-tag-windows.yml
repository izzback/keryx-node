name: Keryx IBD v2 Phase 4.4 Freeze Tag Windows

on:
  push:
    branches:
      - ibd-v2-phase4-db-batching
    paths:
      - '.github/workflows/ibd-v2-phase4-tag-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-freeze:
    name: Tag frozen Phase 4.4 functional commit
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Verify and publish immutable Phase 4.4 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'ibd-v2-phase4.4-frozen-v1.5.6'
          $expected = 'ef3a4de6b8780087cede4fa29d81af2a9295151f'
          $api = "https://api.github.com/repos/izzback/keryx-node/git/ref/tags/$tag"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          git cat-file -e "$expected^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Phase 4.4 functional commit $expected is unavailable" }

          $existing = $null
          try {
            $existing = Invoke-RestMethod -Method Get -Uri $api -Headers $headers -UseBasicParsing
          } catch {
            $status = $null
            if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
            if ($status -ne 404) { throw }
          }

          if ($null -ne $existing) {
            $actual = [string]$existing.object.sha
            if ($actual -ne $expected) {
              throw "existing remote tag $tag points to $actual instead of $expected"
            }
            Write-Host "TAG_ALREADY_CORRECT=$tag@$actual"
            exit 0
          }

          $body = @{ ref = "refs/tags/$tag"; sha = $expected } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/izzback/keryx-node/git/refs' -Headers $headers -Body $body -ContentType 'application/json' -UseBasicParsing | Out-Null

          $published = Invoke-RestMethod -Method Get -Uri $api -Headers $headers -UseBasicParsing
          $actual = [string]$published.object.sha
          if ($actual -ne $expected) { throw "published tag resolves to $actual instead of $expected" }
          Write-Host "PHASE4_4_FREEZE_TAG=$tag"
          Write-Host "PHASE4_4_FUNCTIONAL_COMMIT=$actual"
