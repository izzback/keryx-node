name: Keryx IBD v2 CI

on:
  push:
    branches:
      - ibd-v2
    paths:
      - 'protocol/flows/src/ibd/**'
      - 'protocol/flows/src/ibd_v2/**'
      - 'protocol/flows/src/lib.rs'
      - 'protocol/flows/Cargo.toml'
      - 'docs/ibd-v2/**'
      - '.github/workflows/ibd-v2-ci.yml'
  pull_request:
    branches:
      - ibd-v2-base-v1.5.4
    paths:
      - 'protocol/flows/src/ibd/**'
      - 'protocol/flows/src/ibd_v2/**'
      - 'protocol/flows/src/lib.rs'
      - 'protocol/flows/Cargo.toml'
      - 'docs/ibd-v2/**'
      - '.github/workflows/ibd-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibd-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flows:
    name: IBD v2 flows gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: ibd-v2-flows-rust-1.93
          cache-on-failure: true

      - name: Check formatting of IBD v2 touch points
        shell: bash
        run: |
          rustfmt --edition 2024 --check \
            protocol/flows/src/ibd_v2/*.rs \
            protocol/flows/src/ibd/flow.rs \
            protocol/flows/src/ibd/progress.rs \
            protocol/flows/src/ibd/streams.rs

      - name: Check P2P flows crate
        run: cargo check -p keryx-p2p-flows --all-targets

      - name: Clippy P2P flows crate
        run: cargo clippy -p keryx-p2p-flows --all-targets --no-deps -- -D warnings -A clippy::collapsible_if

      - name: Test P2P flows crate
        run: cargo test -p keryx-p2p-flows

  stage-service-state:
    name: Stage service-state metrics
    if: github.event_name == 'pull_request' && github.head_ref == 'ibd-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ibd-v2

      - name: Apply exact instrumentation patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('protocol/flows/src/ibd/flow.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(text, label, old, new):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one target, found {count}')
              return text.replace(old, new, 1)

          text = replace_once(
              text,
              'metrics import',
              '''    ibd::{HeadersChunkStream, TrustedEntryStream, negotiate::ChainNegotiationOutput},
          };''',
              '''    ibd::{HeadersChunkStream, TrustedEntryStream, negotiate::ChainNegotiationOutput},
              ibd_v2::metrics::{StageMetrics, metrics_enabled},
          };''',
          )

          text = replace_once(
              text,
              'service-state receive timer',
              '''        let mut acc = MuHash::new();
                  loop {
                      match tokio::time::timeout(keryx_p2p_lib::common::DEFAULT_TIMEOUT, self.incoming_route.recv()).await {''',
              '''        let mut acc = MuHash::new();
                  let mut metrics = StageMetrics::new();
                  loop {
                      let wait_started = metrics_enabled().then(Instant::now);
                      let received = tokio::time::timeout(keryx_p2p_lib::common::DEFAULT_TIMEOUT, self.incoming_route.recv()).await;
                      if let Some(wait_started) = wait_started {
                          metrics.record_peer_wait_time(wait_started.elapsed());
                      }
                      match received {''',
          )

          text = replace_once(
              text,
              'service-state chunk counters',
              '''                    Some(Payload::ServiceStateChunk(chunk)) => {
                              for row in chunk.rows {''',
              '''                    Some(Payload::ServiceStateChunk(chunk)) => {
                              if metrics_enabled() {
                                  let chunk_rows = chunk.rows.len() as u64;
                                  let chunk_bytes = chunk.rows.iter().map(|row| row.len() as u64).sum();
                                  metrics.record_transfer(chunk_rows, chunk_bytes);
                              }
                              let validation_started = metrics_enabled().then(Instant::now);
                              for row in chunk.rows {''',
          )

          text = replace_once(
              text,
              'service-state validation timer',
              '''                            rows.push(row);
                              }
                          }
                          Some(Payload::DoneServiceStateChunks(_)) => break,''',
              '''                            rows.push(row);
                              }
                              if let Some(validation_started) = validation_started {
                                  metrics.record_validation_time(validation_started.elapsed());
                              }
                          }
                          Some(Payload::DoneServiceStateChunks(_)) => break,''',
          )

          text = replace_once(
              text,
              'service-state finalize timer',
              '''        let computed = if prefix_rows == 0 { Hash::default() } else { acc.finalize() };''',
              '''        let finalize_started = metrics_enabled().then(Instant::now);
                  let computed = if prefix_rows == 0 { Hash::default() } else { acc.finalize() };
                  if let Some(finalize_started) = finalize_started {
                      metrics.record_validation_time(finalize_started.elapsed());
                  }''',
          )

          text = replace_once(
              text,
              'service-state storage and summary',
              '''        let handoff_rows = rows.len() - prefix_rows;
                  consensus.clone().spawn_blocking(move |c| c.import_service_state(rows)).await?;
                  info!("imported {} sealed service-state rows ({} verified, {} handoff)", prefix_rows + handoff_rows, prefix_rows, handoff_rows);''',
              '''        let handoff_rows = rows.len() - prefix_rows;
                  let storage_started = metrics_enabled().then(Instant::now);
                  consensus.clone().spawn_blocking(move |c| c.import_service_state(rows)).await?;
                  if let Some(storage_started) = storage_started {
                      metrics.record_storage_time(storage_started.elapsed());
                  }
                  info!("imported {} sealed service-state rows ({} verified, {} handoff)", prefix_rows + handoff_rows, prefix_rows, handoff_rows);
                  if metrics_enabled() {
                      info!(
                          "IBD-V2-METRICS: stage=service-state complete=true rows={} verified={} handoff={} bytes={} elapsed={:.3}s rate={:.2} rows/s throughput={:.2} MB/s peer_wait={:.3}s peer_wait_pct={:.1}% validation={:.3}s storage={:.3}s",
                          metrics.items,
                          prefix_rows,
                          handoff_rows,
                          metrics.bytes,
                          metrics.elapsed_seconds(),
                          metrics.items_per_second(),
                          metrics.megabytes_per_second(),
                          metrics.peer_wait_time.as_secs_f64(),
                          metrics.peer_wait_ratio() * 100.0,
                          metrics.validation_time.as_secs_f64(),
                          metrics.storage_time.as_secs_f64()
                      );
                  }''',
          )

          path.write_text(text, encoding='utf-8')

      - name: Install pinned rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt

      - name: Format and commit patch
        shell: bash
        run: |
          rustfmt --edition 2024 protocol/flows/src/ibd/flow.rs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/flows/src/ibd/flow.rs
          git commit -m "feat(ibd-v2): instrument service-state sync"
          git push origin HEAD:ibd-v2
