name: Keryx IBD v2 CI

on:
  push:
    branches:
      - ibd-v2
    paths:
      - 'protocol/flows/src/ibd/**'
      - 'protocol/flows/src/ibd_v2/**'
      - 'protocol/flows/src/lib.rs'
      - 'protocol/flows/Cargo.toml'
      - 'docs/ibd-v2/**'
      - '.github/workflows/ibd-v2-ci.yml'
  pull_request:
    branches:
      - ibd-v2-base-v1.5.4
    paths:
      - 'protocol/flows/src/ibd/**'
      - 'protocol/flows/src/ibd_v2/**'
      - 'protocol/flows/src/lib.rs'
      - 'protocol/flows/Cargo.toml'
      - 'docs/ibd-v2/**'
      - '.github/workflows/ibd-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibd-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flows:
    name: IBD v2 flows gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: ibd-v2-flows-rust-1.93
          cache-on-failure: true

      - name: Check formatting of IBD v2 touch points
        shell: bash
        run: |
          rustfmt --edition 2024 --check \
            protocol/flows/src/ibd_v2/*.rs \
            protocol/flows/src/ibd/progress.rs \
            protocol/flows/src/ibd/streams.rs

      - name: Check P2P flows crate
        run: cargo check -p keryx-p2p-flows --all-targets

      - name: Clippy P2P flows crate
        run: cargo clippy -p keryx-p2p-flows --all-targets --no-deps -- -D warnings -A clippy::collapsible_if

      - name: Test P2P flows crate
        run: cargo test -p keryx-p2p-flows

  stage-service-state:
    name: Stage service-state metrics
    if: github.event_name == 'pull_request' && github.head_ref == 'ibd-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ibd-v2

      - name: Apply indentation-agnostic instrumentation patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('protocol/flows/src/ibd/flow.rs')
          lines = path.read_text(encoding='utf-8').splitlines()
          out = []
          in_service = False
          pending_row_loop_close = False
          for_indent = None
          counts = {
              'import': 0,
              'metrics': 0,
              'receive': 0,
              'chunk': 0,
              'validation': 0,
              'finalize': 0,
              'storage': 0,
              'summary': 0,
          }

          for line in lines:
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]

              if stripped == 'ibd::{HeadersChunkStream, TrustedEntryStream, negotiate::ChainNegotiationOutput},':
                  out.append(line)
                  out.append(f'{indent}ibd_v2::metrics::{{StageMetrics, metrics_enabled}},')
                  counts['import'] += 1
                  continue

              if stripped == 'async fn sync_service_state(':
                  in_service = True
              elif in_service and stripped == 'async fn sync_missing_relay_past_headers(':
                  in_service = False

              if in_service and stripped == 'let mut acc = MuHash::new();':
                  out.append(line)
                  out.append(f'{indent}let mut metrics = StageMetrics::new();')
                  counts['metrics'] += 1
                  continue

              if in_service and stripped == 'match tokio::time::timeout(keryx_p2p_lib::common::DEFAULT_TIMEOUT, self.incoming_route.recv()).await {':
                  out.append(f'{indent}let wait_started = metrics_enabled().then(Instant::now);')
                  out.append(f'{indent}let received =')
                  out.append(f'{indent}    tokio::time::timeout(keryx_p2p_lib::common::DEFAULT_TIMEOUT, self.incoming_route.recv()).await;')
                  out.append(f'{indent}if let Some(wait_started) = wait_started {{')
                  out.append(f'{indent}    metrics.record_peer_wait_time(wait_started.elapsed());')
                  out.append(f'{indent}}}')
                  out.append(f'{indent}match received {{')
                  counts['receive'] += 1
                  continue

              if in_service and stripped == 'Some(Payload::ServiceStateChunk(chunk)) => {':
                  out.append(line)
                  child = indent + '    '
                  out.append(f'{child}if metrics_enabled() {{')
                  out.append(f'{child}    let chunk_rows = chunk.rows.len() as u64;')
                  out.append(f'{child}    let chunk_bytes = chunk.rows.iter().map(|row| row.len() as u64).sum();')
                  out.append(f'{child}    metrics.record_transfer(chunk_rows, chunk_bytes);')
                  out.append(f'{child}}}')
                  out.append(f'{child}let validation_started = metrics_enabled().then(Instant::now);')
                  counts['chunk'] += 1
                  continue

              if in_service and stripped == 'for row in chunk.rows {':
                  for_indent = len(indent)
                  out.append(line)
                  continue

              if in_service and stripped == 'rows.push(row);':
                  pending_row_loop_close = True
                  out.append(line)
                  continue

              if in_service and pending_row_loop_close and stripped == '}' and len(indent) == for_indent:
                  out.append(line)
                  out.append(f'{indent}if let Some(validation_started) = validation_started {{')
                  out.append(f'{indent}    metrics.record_validation_time(validation_started.elapsed());')
                  out.append(f'{indent}}}')
                  pending_row_loop_close = False
                  counts['validation'] += 1
                  continue

              if in_service and stripped == 'let computed = if prefix_rows == 0 { Hash::default() } else { acc.finalize() };':
                  out.append(f'{indent}let finalize_started = metrics_enabled().then(Instant::now);')
                  out.append(line)
                  out.append(f'{indent}if let Some(finalize_started) = finalize_started {{')
                  out.append(f'{indent}    metrics.record_validation_time(finalize_started.elapsed());')
                  out.append(f'{indent}}}')
                  counts['finalize'] += 1
                  continue

              if in_service and stripped == 'consensus.clone().spawn_blocking(move |c| c.import_service_state(rows)).await?;':
                  out.append(f'{indent}let storage_started = metrics_enabled().then(Instant::now);')
                  out.append(line)
                  out.append(f'{indent}if let Some(storage_started) = storage_started {{')
                  out.append(f'{indent}    metrics.record_storage_time(storage_started.elapsed());')
                  out.append(f'{indent}}}')
                  counts['storage'] += 1
                  continue

              if in_service and stripped.startswith('info!("imported {} sealed service-state rows'):
                  out.append(line)
                  out.append(f'{indent}if metrics_enabled() {{')
                  out.append(f'{indent}    info!(')
                  out.append(f'{indent}        "IBD-V2-METRICS: stage=service-state complete=true rows={{}} verified={{}} handoff={{}} bytes={{}} elapsed={{:.3}}s rate={{:.2}} rows/s throughput={{:.2}} MB/s peer_wait={{:.3}}s peer_wait_pct={{:.1}}% validation={{:.3}}s storage={{:.3}}s",')
                  out.append(f'{indent}        metrics.items,')
                  out.append(f'{indent}        prefix_rows,')
                  out.append(f'{indent}        handoff_rows,')
                  out.append(f'{indent}        metrics.bytes,')
                  out.append(f'{indent}        metrics.elapsed_seconds(),')
                  out.append(f'{indent}        metrics.items_per_second(),')
                  out.append(f'{indent}        metrics.megabytes_per_second(),')
                  out.append(f'{indent}        metrics.peer_wait_time.as_secs_f64(),')
                  out.append(f'{indent}        metrics.peer_wait_ratio() * 100.0,')
                  out.append(f'{indent}        metrics.validation_time.as_secs_f64(),')
                  out.append(f'{indent}        metrics.storage_time.as_secs_f64()')
                  out.append(f'{indent}    );')
                  out.append(f'{indent}}}')
                  counts['summary'] += 1
                  continue

              out.append(line)

          expected = {key: 1 for key in counts}
          if counts != expected:
              raise SystemExit(f'patch anchors mismatch: {counts}')

          path.write_text('\n'.join(out) + '\n', encoding='utf-8')

      - name: Validate and commit patch
        shell: bash
        run: |
          git diff --check
          git diff -- protocol/flows/src/ibd/flow.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/flows/src/ibd/flow.rs
          git commit -m "feat(ibd-v2): instrument service-state sync"
          git push origin HEAD:ibd-v2
