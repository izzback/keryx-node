name: Keryx IBD v2 CI

on:
  push:
    branches:
      - ibd-v2
    paths:
      - 'protocol/flows/src/ibd/**'
      - 'protocol/flows/src/ibd_v2/**'
      - 'protocol/flows/src/lib.rs'
      - 'protocol/flows/Cargo.toml'
      - 'docs/ibd-v2/**'
      - '.github/workflows/ibd-v2-ci.yml'
  pull_request:
    branches:
      - ibd-v2-base-v1.5.4
    paths:
      - 'protocol/flows/src/ibd/**'
      - 'protocol/flows/src/ibd_v2/**'
      - 'protocol/flows/src/lib.rs'
      - 'protocol/flows/Cargo.toml'
      - 'docs/ibd-v2/**'
      - '.github/workflows/ibd-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibd-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flows:
    name: IBD v2 flows gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: ibd-v2-flows-rust-1.93
          cache-on-failure: true

      - name: Check formatting of IBD v2 touch points
        shell: bash
        run: |
          rustfmt --edition 2024 --check \
            protocol/flows/src/ibd_v2/*.rs \
            protocol/flows/src/ibd/flow.rs \
            protocol/flows/src/ibd/progress.rs \
            protocol/flows/src/ibd/streams.rs

      - name: Check P2P flows crate
        run: cargo check -p keryx-p2p-flows --all-targets

      - name: Clippy P2P flows crate
        run: cargo clippy -p keryx-p2p-flows --all-targets --no-deps -- -D warnings -A clippy::collapsible_if

      - name: Test P2P flows crate
        run: cargo test -p keryx-p2p-flows

  stage-utxo:
    name: Stage UTXO processing metrics
    if: github.event_name == 'pull_request' && github.head_ref == 'ibd-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ibd-v2

      - name: Apply UTXO processing instrumentation
        run: python .github/scripts/stage-ibd-v2-utxo-processing-metrics.py

      - name: Install pinned rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt

      - name: Validate and commit patch
        shell: bash
        run: |
          rustfmt --edition 2024 protocol/flows/src/ibd/flow.rs
          git diff --check
          git diff -- protocol/flows/src/ibd/flow.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol/flows/src/ibd/flow.rs
          git commit -m "feat(ibd-v2): instrument UTXO processing"
          git push origin HEAD:ibd-v2
