name: Keryx IBD v2 CI

on:
  push:
    branches:
      - ibd-v2
    paths:
      - 'protocol/flows/src/ibd/**'
      - 'protocol/flows/src/ibd_v2/**'
      - 'protocol/flows/src/v7/request_service_state.rs'
      - 'protocol/flows/src/lib.rs'
      - 'protocol/flows/Cargo.toml'
      - 'protocol/p2p/proto/**'
      - 'protocol/p2p/src/convert/messages.rs'
      - 'docs/ibd-v2/**'
      - '.github/workflows/ibd-v2-ci.yml'
  pull_request:
    branches:
      - ibd-v2-base-v1.5.4
    paths:
      - 'protocol/flows/src/ibd/**'
      - 'protocol/flows/src/ibd_v2/**'
      - 'protocol/flows/src/v7/request_service_state.rs'
      - 'protocol/flows/src/lib.rs'
      - 'protocol/flows/Cargo.toml'
      - 'protocol/p2p/proto/**'
      - 'protocol/p2p/src/convert/messages.rs'
      - 'docs/ibd-v2/**'
      - '.github/workflows/ibd-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibd-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flows:
    name: IBD v2 flows gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: ibd-v2-flows-rust-1.93
          cache-on-failure: true

      - name: Check formatting of IBD v2 touch points
        shell: bash
        run: |
          rustfmt --edition 2024 --check \
            protocol/flows/src/ibd_v2/*.rs \
            protocol/flows/src/ibd/flow.rs \
            protocol/flows/src/ibd/progress.rs \
            protocol/flows/src/ibd/streams.rs \
            protocol/flows/src/v7/request_service_state.rs \
            protocol/p2p/src/convert/messages.rs

      - name: Check P2P wire crate
        run: cargo check -p keryx-p2p-lib --all-targets

      - name: Check P2P flows crate
        run: cargo check -p keryx-p2p-flows --all-targets

      - name: Clippy P2P flows crate
        run: cargo clippy -p keryx-p2p-flows --all-targets --no-deps -- -D warnings -A clippy::collapsible_if

      - name: Test P2P flows crate
        run: cargo test -p keryx-p2p-flows

  stage-service-state-wire:
    name: Stage resumable service-state wire
    if: (github.event_name == 'push' && github.ref == 'refs/heads/ibd-v2') || (github.event_name == 'pull_request' && github.head_ref == 'ibd-v2')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout ibd-v2
        uses: actions/checkout@v4
        with:
          ref: ibd-v2
          fetch-depth: 0

      - name: Detect whether staging is needed
        id: detect
        shell: bash
        run: |
          if grep -q 'optional uint64 startCursor = 2;' protocol/p2p/proto/p2p.proto; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'Resumable service-state wire metadata is already present.'
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install protoc
        if: steps.detect.outputs.needed == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Rust toolchain
        if: steps.detect.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Apply resumable wire patch
        if: steps.detect.outputs.needed == 'true'
        run: python .github/scripts/stage-ibd-v2-service-state-wire.py

      - name: Format modified Rust files
        if: steps.detect.outputs.needed == 'true'
        run: |
          rustfmt --edition 2024 \
            protocol/flows/src/ibd_v2/state.rs \
            protocol/flows/src/ibd/flow.rs \
            protocol/flows/src/v7/request_service_state.rs
          git diff --check

      - name: Check staged P2P wire crate
        if: steps.detect.outputs.needed == 'true'
        run: cargo check -p keryx-p2p-lib --all-targets

      - name: Check staged P2P flows crate
        if: steps.detect.outputs.needed == 'true'
        run: cargo check -p keryx-p2p-flows --all-targets

      - name: Clippy staged P2P flows crate
        if: steps.detect.outputs.needed == 'true'
        run: cargo clippy -p keryx-p2p-flows --all-targets --no-deps -- -D warnings -A clippy::collapsible_if

      - name: Commit verified wire patch
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "izzback"
          git config user.email "poolarismining1@gmail.com"
          git add \
            protocol/p2p/proto/p2p.proto \
            protocol/flows/src/ibd/flow.rs \
            protocol/flows/src/ibd_v2/state.rs \
            protocol/flows/src/v7/request_service_state.rs
          git diff --cached --exit-code && { echo "wire patch produced no changes"; exit 1; } || true
          git commit -m "feat(ibd-v2): add resumable service-state wire metadata"
          git push origin HEAD:ibd-v2
