name: Validate service refold fix

on:
  push:
    branches:
      - fix/v1.4.8-service-refold-pruned-horizon

permissions:
  contents: write

jobs:
  validate-fix:
    if: ${{ !contains(github.event.head_commit.message, '[service-refold-validated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.4.8-service-refold-pruned-horizon
          fetch-depth: 0

      - name: Repair staged syntax typo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('consensus/src/pipeline/virtual_processor/service_bond.rs')
          s = p.read_text()
          old = 'responses.push((resp.request_hash, verified_responder(&resp));'
          new = 'responses.push((resp.request_hash, verified_responder(&resp)));'
          if old not in s:
              raise SystemExit('expected staged syntax typo not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Format
        run: cargo fmt --all

      - name: Unit regression
        run: cargo test -p keryx-consensus service_replay_mode_separates_finalized_history_from_live_state --lib

      - name: Source sanity
        shell: bash
        run: |
          git diff --check
          git diff -- consensus/src/pipeline/virtual_processor/service_bond.rs

      - name: Commit validated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consensus/src/pipeline/virtual_processor/service_bond.rs
          git commit -m "fix(consensus): validate service refold replay [service-refold-validated]"
          git push origin HEAD:fix/v1.4.8-service-refold-pruned-horizon
