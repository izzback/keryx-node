name: Keryx IBD v2 Phase 4.4 Status Batch Windows

on:
  push:
    branches:
      - ibd-v2-phase4-db-batching
    paths:
      - '.github/workflows/ibd-v2-phase4-status-batch-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ibd-v2-phase4-status-batch-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-test-commit:
    name: Apply, test and commit Phase 4.4 status batch
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout active Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: ibd-v2-phase4-db-batching
          fetch-depth: 0
          clean: true

      - name: Verify expected Phase 4.3 frozen base
        run: |
          $ErrorActionPreference = 'Stop'
          $required = '63f6e9f3cfc50fb6b19e726a349285bd5fbe283c'
          git merge-base --is-ancestor $required HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Phase 4.3 functional commit is not an ancestor of Phase 4.4 base' }
          $dirty = @(git status --porcelain)
          if ($dirty.Count -ne 0) { throw "source tree dirty before Phase 4.4: $($dirty -join '; ')" }
          git log -1 --oneline

      - name: Install protoc 29.6
        run: |
          $ErrorActionPreference = 'Stop'
          $protocVersion = '29.6'
          $archive = Join-Path $env:RUNNER_TEMP "protoc-$protocVersion-phase44-win64.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "protoc-$protocVersion-phase44"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$protocVersion/protoc-$protocVersion-win64.zip"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $protocBin = Join-Path $installDir 'bin'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$protocBin`r`n", $utf8NoBom)
          & (Join-Path $protocBin 'protoc.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'protoc version check failed' }

      - name: Install Rust 1.93.0 natively
        run: |
          $ErrorActionPreference = 'Stop'
          $rustRoot = Join-Path $env:RUNNER_TEMP 'rust-1.93.0-phase44'
          $cargoHome = Join-Path $rustRoot 'cargo'
          $rustupHome = Join-Path $rustRoot 'rustup'
          $rustupInit = Join-Path $env:RUNNER_TEMP 'rustup-init-phase44.exe'
          $rustupUrl = 'https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe'
          if (Test-Path $rustRoot) { Remove-Item $rustRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $rustRoot -Force | Out-Null
          Invoke-WebRequest -Uri $rustupUrl -OutFile $rustupInit -UseBasicParsing
          $env:CARGO_HOME = $cargoHome
          $env:RUSTUP_HOME = $rustupHome
          & $rustupInit -y --no-modify-path --profile minimal --default-host x86_64-pc-windows-msvc --default-toolchain 1.93.0
          if ($LASTEXITCODE -ne 0) { throw 'rustup-init failed' }
          $cargoBin = Join-Path $cargoHome 'bin'
          & (Join-Path $cargoBin 'rustup.exe') component add rustfmt clippy --toolchain 1.93.0-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'rustup component install failed' }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "CARGO_HOME=$cargoHome`r`nRUSTUP_HOME=$rustupHome`r`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$cargoBin`r`n", $utf8NoBom)
          & (Join-Path $cargoBin 'rustc.exe') --version --verbose
          & (Join-Path $cargoBin 'cargo.exe') --version

      - name: Apply Phase 4.4 status batching
        run: |
          & 'scripts/ibd-v2/phase4/apply-status-batching-v156.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Phase 4.4 apply script failed' }

      - name: Compile Phase 4.4 targets
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check -p keryx-database --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'database check failed' }
          cargo check -p keryx-consensus-core --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'consensus-core check failed' }
          cargo check -p keryx-consensus --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'consensus check failed' }
          cargo check -p keryx-consensusmanager --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'consensusmanager check failed' }
          cargo check -p keryx-p2p-flows --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'p2p-flows check failed' }
          cargo check -p keryxd --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'keryxd check failed' }

      - name: Clippy Phase 4.4 touched consumers
        run: |
          $ErrorActionPreference = 'Stop'
          cargo clippy -p keryx-consensus --all-targets --no-deps -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'consensus Clippy failed' }
          cargo clippy -p keryx-consensusmanager --all-targets --no-deps -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'consensusmanager Clippy failed' }
          cargo clippy -p keryx-p2p-flows --all-targets --no-deps -- -D warnings -A clippy::type-complexity -A clippy::collapsible-if
          if ($LASTEXITCODE -ne 0) { throw 'p2p-flows Clippy failed' }

      - name: Run Phase 4.4 regressions
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test -p keryx-p2p-flows ibd_v2
          if ($LASTEXITCODE -ne 0) { throw 'IBD v2 regression tests failed' }
          cargo test -p keryx-consensus pruning_point_utxo_import_replay_is_idempotent
          if ($LASTEXITCODE -ne 0) { throw 'UTXO replay regression failed' }
          cargo test -p keryx-consensus model::stores::ghostdag::tests::test_mergeset_iterators
          if ($LASTEXITCODE -ne 0) { throw 'Ghostdag regression failed' }

      - name: Guard Phase 4.4 semantics
        run: |
          $ErrorActionPreference = 'Stop'
          $statuses = [IO.File]::ReadAllText((Resolve-Path 'consensus/src/model/stores/statuses.rs'))
          if (-not $statuses.Contains('self.access.read_many(hashes)')) { throw 'status read_many guard missing' }
          $consensus = [IO.File]::ReadAllText((Resolve-Path 'consensus/src/consensus/mod.rs'))
          foreach ($needle in @(
            'hashes.iter().zip(self.get_block_statuses(&hashes))',
            'None => return Err(ConsensusError::HeaderNotFound(hash))',
            'Some(BlockStatus::StatusInvalid) => return Err(ConsensusError::InvalidBlock(hash))',
            'self.ghostdag_store.get_data_batch(&hashes)'
          )) {
            if (-not $consensus.Contains($needle)) { throw "Phase 4.4 semantic guard missing: $needle" }
          }
          $flow = [IO.File]::ReadAllText((Resolve-Path 'protocol/flows/src/ibd/flow.rs'))
          if (([regex]::Matches($flow, 'async_get_ghostdag_data_batch\(')).Count -ne 2) {
            throw 'trusted body flows must retain exactly two Ghostdag batch call sites'
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Phase 4.4 diff hygiene failed' }

      - name: Build release node
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release -p keryxd
          if ($LASTEXITCODE -ne 0) { throw 'release build failed' }

      - name: Commit functional Phase 4.4 only after GREEN
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'consensus/core/src/api/mod.rs',
            'consensus/src/consensus/mod.rs',
            'consensus/src/model/stores/statuses.rs'
          )
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $expected })
          if ($unexpected.Count -ne 0) { throw "unexpected files before commit: $($unexpected -join ', ')" }
          foreach ($file in $expected) {
            if ($file -notin $changed) { throw "missing expected Phase 4.4 change: $file" }
          }
          git config user.name 'Keryx IBD V2 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $expected
          git commit -m 'perf(ibd-v2): batch trusted status reads'
          if ($LASTEXITCODE -ne 0) { throw 'functional commit failed' }
          $sha = (git rev-parse HEAD).Trim()
          Write-Host "PHASE4_4_FUNCTIONAL_COMMIT=$sha"
          git push origin HEAD:ibd-v2-phase4-db-batching
          if ($LASTEXITCODE -ne 0) { throw 'functional push failed' }
