name: Keryx IBD v2 Phase 1.4 CI

on:
  push:
    branches:
      - ibd-v2-phase1-4-checkpoint
    paths:
      - 'protocol/flows/src/ibd_v2/**'
      - 'protocol/flows/src/ibd/**'
      - 'protocol/flows/src/flow_context.rs'
      - 'keryxd/src/daemon.rs'
      - '.github/workflows/ibd-v2-phase1-4-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibd-v2-phase1-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    name: Durable checkpoint gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: ibd-v2-phase1-4-rust-1.93
          cache-on-failure: true

      - name: Rustfmt
        run: rustfmt --edition 2024 --check protocol/flows/src/ibd_v2/*.rs protocol/flows/src/ibd/flow.rs protocol/flows/src/flow_context.rs

      - name: Check flows
        run: cargo check -p keryx-p2p-flows --all-targets

      - name: Clippy flows
        run: cargo clippy -p keryx-p2p-flows --all-targets --no-deps -- -D warnings -A clippy::collapsible_if

      - name: Test flows
        run: cargo test -p keryx-p2p-flows
