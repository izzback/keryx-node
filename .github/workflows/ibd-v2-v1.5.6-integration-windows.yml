name: Keryx IBD v2 v1.5.6 Integration Windows

# Critical project policy: this integration may run only on the dedicated local Windows runner.
# Never replace this with any GitHub-hosted image.

on:
  push:
    branches:
      - ibd-v2-integrate-v1.5.6
    paths:
      - '.github/workflows/ibd-v2-v1.5.6-integration-windows.yml'
      - 'scripts/ibd-v2/integrate-v1.5.6.ps1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ibd-v2-v1.5.6-integration-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    name: Merge and certify official v1.5.6
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ibd-v2-integrate-v1.5.6
          fetch-depth: 0
          clean: true

      - name: Install protoc 29.6
        run: |
          $ErrorActionPreference = 'Stop'
          $protocVersion = '29.6'
          $archive = Join-Path $env:RUNNER_TEMP "protoc-$protocVersion-win64.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "protoc-$protocVersion-v156"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$protocVersion/protoc-$protocVersion-win64.zip"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $protocBin = Join-Path $installDir 'bin'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$protocBin`r`n", $utf8NoBom)
          & (Join-Path $protocBin 'protoc.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "protoc version check failed with exit code $LASTEXITCODE" }

      - name: Install Rust 1.93.0 natively
        run: |
          $ErrorActionPreference = 'Stop'
          $rustRoot = Join-Path $env:RUNNER_TEMP 'rust-1.93.0-v156'
          $cargoHome = Join-Path $rustRoot 'cargo'
          $rustupHome = Join-Path $rustRoot 'rustup'
          $rustupInit = Join-Path $env:RUNNER_TEMP 'rustup-init-v156.exe'
          $rustupUrl = 'https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe'
          New-Item -ItemType Directory -Path $rustRoot -Force | Out-Null
          Invoke-WebRequest -Uri $rustupUrl -OutFile $rustupInit -UseBasicParsing
          $env:CARGO_HOME = $cargoHome
          $env:RUSTUP_HOME = $rustupHome
          & $rustupInit -y --no-modify-path --profile minimal --default-host x86_64-pc-windows-msvc --default-toolchain 1.93.0
          if ($LASTEXITCODE -ne 0) { throw "rustup-init failed with exit code $LASTEXITCODE" }
          $cargoBin = Join-Path $cargoHome 'bin'
          & (Join-Path $cargoBin 'rustup.exe') component add rustfmt clippy --toolchain 1.93.0-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "rustup component install failed with exit code $LASTEXITCODE" }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CARGO_HOME=$cargoHome`r`nRUSTUP_HOME=$rustupHome`r`n", $utf8NoBom)
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$cargoBin`r`n", $utf8NoBom)
          & (Join-Path $cargoBin 'rustc.exe') --version --verbose
          & (Join-Path $cargoBin 'cargo.exe') --version

      - name: Integrate and certify v1.5.6
        run: .\scripts\ibd-v2\integrate-v1.5.6.ps1

      - name: Package certified v1.5.6 node
        if: success()
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          $out = Join-Path $PWD 'ibd-v2-v1.5.6-artifact'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item 'target\release\keryxd.exe' (Join-Path $out 'keryxd.exe')
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'target\release\keryxd.exe').Hash.ToLowerInvariant()
          @(
            'project=Keryx IBD V2',
            'upstream_version=1.5.6',
            'official_upstream_commit=a8e23793363c509325881f6146176f39bf52f77f',
            "integration_commit=$sha",
            'runner=Keryx-Node-Windows-01',
            "keryxd_sha256=$hash"
          ) | Set-Content -Encoding ASCII -LiteralPath (Join-Path $out 'BUILD-MANIFEST.txt')

      - name: Upload certified v1.5.6 node
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: keryx-ibd-v2-v1.5.6-${{ github.sha }}
          path: ibd-v2-v1.5.6-artifact
          if-no-files-found: error
          retention-days: 14
