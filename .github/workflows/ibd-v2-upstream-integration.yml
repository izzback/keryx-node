name: Keryx IBD v2 Upstream Integration

on:
  pull_request:
    branches:
      - ibd-v2
    paths:
      - 'consensus/core/src/**'
      - 'consensus/src/**'
      - 'database/src/**'
      - 'keryxd/src/**'
      - 'protocol/flows/src/**'
      - '.github/workflows/ibd-v2-upstream-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibd-v2-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Upstream consensus/storage compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust 1.93 and AArch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu

      - name: Install AArch64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: ibd-v2-upstream-rust-1.93
          cache-on-failure: true

      - name: Check P2P flows
        run: cargo check -p keryx-p2p-flows --all-targets

      - name: Test consensus core including PoM vectors
        run: cargo test -p keryx-consensus-core

      - name: Check consensus core AArch64 NEON path
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check -p keryx-consensus-core --lib --target aarch64-unknown-linux-gnu

      - name: Check consensus storage
        run: cargo check -p keryx-consensus --all-targets

      - name: Check database
        run: cargo check -p keryx-database --all-targets

      - name: Check keryxd
        run: cargo check -p keryxd
