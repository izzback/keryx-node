name: Keryx IBD v2 Phase 4.4 Freeze Tag Local GH Windows

on:
  push:
    branches:
      - ibd-v2-phase4-db-batching
    paths:
      - '.github/workflows/ibd-v2-phase4-tag-local-gh-windows.yml'
  workflow_dispatch:

jobs:
  tag-freeze:
    name: Publish tag with runner-local GitHub CLI auth
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Verify runner-local GitHub authentication and publish tag
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue

          $loginLines = @(& gh api user --jq .login 2>$null)
          if ($LASTEXITCODE -ne 0 -or $loginLines.Count -eq 0) {
            throw 'runner service account has no independent GitHub CLI authentication'
          }
          $login = [string]$loginLines[0]
          Write-Host "LOCAL_GH_AUTH_LOGIN=$login"

          $tag = 'ibd-v2-phase4.4-frozen-v1.5.6'
          $expected = 'ef3a4de6b8780087cede4fa29d81af2a9295151f'
          $refEndpoint = "repos/izzback/keryx-node/git/ref/tags/$tag"

          $existingLines = @(& gh api $refEndpoint --jq .object.sha 2>$null)
          if ($LASTEXITCODE -eq 0 -and $existingLines.Count -gt 0) {
            $actual = [string]$existingLines[0]
            if ($actual -ne $expected) {
              throw "existing tag $tag points to $actual instead of $expected"
            }
            Write-Host "TAG_ALREADY_CORRECT=$tag@$actual"
            exit 0
          }

          & gh api --method POST 'repos/izzback/keryx-node/git/refs' -f "ref=refs/tags/$tag" -f "sha=$expected" --silent
          if ($LASTEXITCODE -ne 0) { throw 'runner-local GitHub CLI failed to create the Phase 4.4 tag' }

          $publishedLines = @(& gh api $refEndpoint --jq .object.sha)
          if ($LASTEXITCODE -ne 0 -or $publishedLines.Count -eq 0) { throw 'could not verify published Phase 4.4 tag' }
          $actual = [string]$publishedLines[0]
          if ($actual -ne $expected) { throw "published tag resolves to $actual instead of $expected" }

          Write-Host "PHASE4_4_FREEZE_TAG=$tag"
          Write-Host "PHASE4_4_FUNCTIONAL_COMMIT=$actual"
