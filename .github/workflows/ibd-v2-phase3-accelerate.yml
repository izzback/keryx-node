name: Keryx IBD v2 Phase 3 Accelerate

# One-shot implementation/certification job. Local Windows runner only.
on:
  push:
    branches:
      - ibd-v2-phase3-persistent-state
    paths:
      - '.github/workflows/ibd-v2-phase3-accelerate.yml'

permissions:
  contents: write

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  accelerate:
    name: Implement and certify Phase 3 real-test hooks
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: ibd-v2-phase3-persistent-state
          clean: true
          fetch-depth: 0

      - name: Apply, certify, build and push Phase 3 candidate
        run: .\scripts\ibd-v2\dev\APPLY-PHASE3-ACCELERATE.ps1

      - name: Upload certified Phase 3 real-test package
        uses: actions/upload-artifact@v4
        with:
          name: keryx-ibd-v2-phase3-realtest
          path: phase3-realtest-artifact
          if-no-files-found: error
          retention-days: 14
