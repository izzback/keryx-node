          Write-Lf 'scripts/ibd-v2/phase3/START-SERVICE-STATE-CRASH-TEST.ps1' @'
[CmdletBinding()]
param(
    [ValidateSet(
        'service-state-after-spool-fsync',
        'service-state-after-checkpoint',
        'service-state-after-verified',
        'service-state-after-import'
    )]
    [string]$FaultPoint = 'service-state-after-import',
    [string]$NodePath = (Join-Path $PSScriptRoot 'keryxd.exe'),
    [string]$DataDir = 'E:\datanode\keryx-ibd-v2-phase3-realtest',
    [string]$ResultsRoot = (Join-Path $PSScriptRoot 'results-phase3')
)

$ErrorActionPreference = 'Stop'
if (!(Test-Path -LiteralPath $NodePath -PathType Leaf)) { throw "Node not found: $NodePath" }
if (Get-Process -Name keryxd -ErrorAction SilentlyContinue) {
    throw 'Another keryxd process is already running. Stop it before the Phase 3 real test.'
}
if (Test-Path -LiteralPath $DataDir) {
    $existing = Get-ChildItem -LiteralPath $DataDir -Force -ErrorAction SilentlyContinue | Select-Object -First 1
    if ($existing) { throw "Crash-test datadir is not empty: $DataDir`nUse CLEAN-PHASE3-REALTEST.ps1 only if you intentionally want a new test." }
} else {
    New-Item -ItemType Directory -Path $DataDir -Force | Out-Null
}
New-Item -ItemType Directory -Path $ResultsRoot -Force | Out-Null
$stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
$resultDir = Join-Path $ResultsRoot "crash-$FaultPoint-$stamp"
New-Item -ItemType Directory -Path $resultDir -Force | Out-Null
$stdout = Join-Path $resultDir 'node.stdout.log'
$stderr = Join-Path $resultDir 'node.stderr.log'

@(
    "fault_point=$FaultPoint",
    "datadir=$DataDir",
    "node=$NodePath",
    "started_utc=$([DateTime]::UtcNow.ToString('o'))"
) | Set-Content -Encoding ASCII -LiteralPath (Join-Path $resultDir 'TEST-METADATA.txt')

$old = @{
    KERYX_IBD_V2 = $env:KERYX_IBD_V2
    KERYX_IBD_V2_METRICS = $env:KERYX_IBD_V2_METRICS
    KERYX_IBD_V2_FAULT_INJECTION = $env:KERYX_IBD_V2_FAULT_INJECTION
    KERYX_IBD_V2_FAULT_POINT = $env:KERYX_IBD_V2_FAULT_POINT
}
try {
    $env:KERYX_IBD_V2 = '1'
    $env:KERYX_IBD_V2_METRICS = '1'
    $env:KERYX_IBD_V2_FAULT_INJECTION = '1'
    $env:KERYX_IBD_V2_FAULT_POINT = $FaultPoint
    Write-Host "Starting HARD-CRASH test at: $FaultPoint" -ForegroundColor Yellow
    Write-Host "Datadir: $DataDir"
    Write-Host 'The node is expected to terminate abnormally when the requested durability boundary is reached.'
    $process = Start-Process -FilePath $NodePath -ArgumentList @("--appdir=$DataDir") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
} finally {
    $env:KERYX_IBD_V2 = $old.KERYX_IBD_V2
    $env:KERYX_IBD_V2_METRICS = $old.KERYX_IBD_V2_METRICS
    $env:KERYX_IBD_V2_FAULT_INJECTION = $old.KERYX_IBD_V2_FAULT_INJECTION
    $env:KERYX_IBD_V2_FAULT_POINT = $old.KERYX_IBD_V2_FAULT_POINT
}

$process.WaitForExit()
$exitCode = $process.ExitCode
Add-Content -Encoding ASCII -LiteralPath (Join-Path $resultDir 'TEST-METADATA.txt') -Value "exit_code=$exitCode"
Add-Content -Encoding ASCII -LiteralPath (Join-Path $resultDir 'TEST-METADATA.txt') -Value "ended_utc=$([DateTime]::UtcNow.ToString('o'))"

$marker = "IBD v2 fault injection: aborting at $FaultPoint"
$found = (Select-String -LiteralPath $stdout,$stderr -SimpleMatch $marker -ErrorAction SilentlyContinue) -ne $null
if ($found) {
    Write-Host "Expected hard crash observed at $FaultPoint." -ForegroundColor Green
} else {
    Write-Warning "The process exited, but the fault marker was not found. Inspect $resultDir before treating the crash as valid."
}
Write-Host ''
Write-Host 'NEXT: restart the SAME datadir with fault injection disabled:' -ForegroundColor Cyan
Write-Host ".\RESUME-SERVICE-STATE-CRASH-TEST.ps1 -DataDir '$DataDir'"
Write-Host "Result folder: $resultDir"
'@

          Write-Lf 'scripts/ibd-v2/phase3/RESUME-SERVICE-STATE-CRASH-TEST.ps1' @'
[CmdletBinding()]
param(
    [string]$NodePath = (Join-Path $PSScriptRoot 'keryxd.exe'),
    [string]$DataDir = 'E:\datanode\keryx-ibd-v2-phase3-realtest'
)

$ErrorActionPreference = 'Stop'
if (!(Test-Path -LiteralPath $NodePath -PathType Leaf)) { throw "Node not found: $NodePath" }
if (!(Test-Path -LiteralPath $DataDir -PathType Container)) { throw "Datadir not found: $DataDir" }
if (!(Get-ChildItem -LiteralPath $DataDir -Force -ErrorAction SilentlyContinue | Select-Object -First 1)) {
    throw "Datadir is empty; there is no crashed run to resume: $DataDir"
}
if (Get-Process -Name keryxd -ErrorAction SilentlyContinue) {
    throw 'Another keryxd process is already running.'
}

$env:KERYX_IBD_V2 = '1'
$env:KERYX_IBD_V2_METRICS = '1'
Remove-Item Env:KERYX_IBD_V2_FAULT_INJECTION -ErrorAction SilentlyContinue
Remove-Item Env:KERYX_IBD_V2_FAULT_POINT -ErrorAction SilentlyContinue

Write-Host 'Resuming the SAME datadir with fault injection disabled.' -ForegroundColor Green
Write-Host "Datadir: $DataDir"
Write-Host 'Look for one of these recovery messages:'
Write-Host '  resuming durable service-state download ...'
Write-Host '  replaying locally verified service-state spool ...'
Write-Host 'Then let the node continue syncing normally.'
Write-Host ''
& $NodePath "--appdir=$DataDir"
exit $LASTEXITCODE
'@

          Write-Lf 'scripts/ibd-v2/phase3/INSPECT-PHASE3-RECOVERY.ps1' @'
[CmdletBinding()]
param(
    [string]$DataDir = 'E:\datanode\keryx-ibd-v2-phase3-realtest',
    [string]$ResultsRoot = (Join-Path $PSScriptRoot 'results-phase3')
)

$patterns = @(
    'IBD v2 fault injection',
    'resuming durable service-state',
    'replaying locally verified service-state spool',
    'service-state wire mode=',
    'imported ',
    'IBD-V2-METRICS: stage=service-state',
    'IBD with peer',
    'completed successfully'
)

$files = @()
if (Test-Path $ResultsRoot) { $files += Get-ChildItem $ResultsRoot -Recurse -File -Filter '*.log' -ErrorAction SilentlyContinue }
if (Test-Path $DataDir) { $files += Get-ChildItem $DataDir -Recurse -File -Filter '*.log' -ErrorAction SilentlyContinue }
$files = $files | Sort-Object FullName -Unique
if (!$files) { throw 'No log files were found.' }

foreach ($file in $files) {
    $matches = Select-String -LiteralPath $file.FullName -Pattern $patterns -SimpleMatch -ErrorAction SilentlyContinue
    if ($matches) {
        Write-Host "`n=== $($file.FullName) ===" -ForegroundColor Cyan
        $matches | Select-Object -Last 100 | ForEach-Object { $_.Line }
    }
}
'@

          Write-Lf 'scripts/ibd-v2/phase3/CLEAN-PHASE3-REALTEST.ps1' @'
[CmdletBinding()]
param([string]$DataDir = 'E:\datanode\keryx-ibd-v2-phase3-realtest')

$expected = 'E:\datanode\keryx-ibd-v2-phase3-realtest'
if (![string]::Equals([IO.Path]::GetFullPath($DataDir).TrimEnd('\'), [IO.Path]::GetFullPath($expected).TrimEnd('\'), [StringComparison]::OrdinalIgnoreCase)) {
    throw "Safety refusal: this cleaner only deletes the exact dedicated test path $expected"
}
if (Get-Process -Name keryxd -ErrorAction SilentlyContinue) { throw 'Stop keryxd before cleaning the test datadir.' }
$confirmation = Read-Host "Type DELETE-PHASE3 to delete $expected"
if ($confirmation -ne 'DELETE-PHASE3') { Write-Host 'Cancelled.'; exit 1 }
if (Test-Path -LiteralPath $expected) { Remove-Item -LiteralPath $expected -Recurse -Force }
New-Item -ItemType Directory -Path $expected -Force | Out-Null
Write-Host "Clean test datadir ready: $expected" -ForegroundColor Green
'@

          Write-Lf 'scripts/ibd-v2/phase3/README-PHASE3-REALTEST.txt' @'
Keryx IBD V2 - Phase 3 real crash/recovery test

Purpose
-------
Prove that Service State survives a real hard process loss and resumes from durable state.
This package is experimental and MUST use a dedicated test datadir.

Default datadir
---------------
E:\datanode\keryx-ibd-v2-phase3-realtest

Never point CLEAN-PHASE3-REALTEST.ps1 at an existing production/mainnet datadir.
The cleaner itself refuses every path except the dedicated path above.

Recommended first real test
---------------------------
1. Make sure every other keryxd instance is stopped.
2. Open PowerShell in this package.
3. Run:

   .\START-SERVICE-STATE-CRASH-TEST.ps1 -FaultPoint service-state-after-import

4. The node intentionally ABORTS after the atomic Service State DB import but before
   the filesystem recovery checkpoint is marked Committed.
5. Restart the SAME datadir:

   .\RESUME-SERVICE-STATE-CRASH-TEST.ps1

6. Expected recovery: the node detects the Verified durable spool, replays it locally,
   atomically imports the same deterministic rows again, marks the checkpoint Committed,
   and continues IBD without downloading Service State from cursor 0.
7. Inspect evidence with:

   .\INSPECT-PHASE3-RECOVERY.ps1

Additional crash points
-----------------------
service-state-after-spool-fsync
  Crash after spool fsync but before checkpoint advancement. Restart must reconcile the
  lagging checkpoint from the spool.

service-state-after-checkpoint
  Crash after both spool and checkpoint are durable. Restart must request from the saved cursor.

service-state-after-verified
  Crash after full MuHash verification but before DB import. Restart must replay the verified
  spool locally without network redownload.

service-state-after-import
  Crash after the atomic RocksDB import but before Committed checkpoint. Restart must safely
  replay the same verified spool and then commit recovery metadata.

Required environment is set by the scripts:
KERYX_IBD_V2=1
KERYX_IBD_V2_METRICS=1
KERYX_IBD_V2_FAULT_INJECTION=1 (crash run only)
KERYX_IBD_V2_FAULT_POINT=<point> (crash run only)
'@

          # Format all modified Rust files before committing the candidate locally.
          cargo fmt -- protocol/flows/src/ibd_v2/fault_injection.rs protocol/flows/src/ibd_v2/mod.rs protocol/flows/src/ibd_v2/service_state_recovery.rs protocol/flows/src/ibd/flow.rs consensus/src/model/stores/service_burn.rs consensus/src/model/stores/service_strike.rs consensus/src/model/stores/service_first_seen.rs consensus/src/model/stores/service_reward.rs consensus/src/consensus/mod.rs
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed' }

          git config user.name 'izzback'
          git config user.email 'poolarismining1@gmail.com'
          git add protocol/flows/src/ibd_v2/fault_injection.rs protocol/flows/src/ibd_v2/mod.rs protocol/flows/src/ibd_v2/service_state_recovery.rs protocol/flows/src/ibd/flow.rs consensus/src/model/stores/service_burn.rs consensus/src/model/stores/service_strike.rs consensus/src/model/stores/service_first_seen.rs consensus/src/model/stores/service_reward.rs consensus/src/consensus/mod.rs scripts/ibd-v2/phase3
          git commit -m 'feat(ibd-v2): make service-state recovery real-crash testable'
          if ($LASTEXITCODE -ne 0) { throw 'candidate commit failed' }
          Write-Host "Candidate commit: $((git rev-parse HEAD).Trim())"

      - name: Check consensus integration
        run: cargo check -p keryx-consensus --all-targets

      - name: Check P2P flows integration
        run: cargo check -p keryx-p2p-flows --all-targets

      - name: Check keryxd integration
        run: cargo check -p keryxd --all-targets

      - name: Clippy changed flow layer
        run: cargo clippy -p keryx-p2p-flows --all-targets --no-deps -- -D warnings -A clippy::collapsible_if

      - name: Test P2P flows recovery suite
        run: cargo test -p keryx-p2p-flows

      - name: Build release test node
        run: |
          cargo build --release -p keryxd
          if ($LASTEXITCODE -ne 0) { throw 'release build failed' }

      - name: Push certified code only
        run: |
          $sha = (git rev-parse HEAD).Trim()
          git push origin HEAD:ibd-v2-phase3-persistent-state
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
          Write-Host "Pushed certified candidate $sha"

      - name: Package certified real-test node
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0, 8)
          $out = Join-Path $PWD 'phase3-realtest-artifact'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item 'target\release\keryxd.exe' (Join-Path $out 'keryxd.exe')
          Copy-Item 'scripts\ibd-v2\phase3\*.ps1' $out
          Copy-Item 'scripts\ibd-v2\phase3\README-PHASE3-REALTEST.txt' $out
          $hash = (Get-FileHash -Algorithm SHA256 'target\release\keryxd.exe').Hash.ToLowerInvariant()
          @(
            'project=Keryx IBD V2 Phase 3',
            "commit=$sha",
            "short_commit=$short",
            'base_official=bb408d54ca3992f7f9f4e269507f7603c234d24d',
            'runner=Keryx-Node-Windows-01',
            'ibd_v2_default=off',
            "keryxd_sha256=$hash"
          ) | Set-Content -Encoding ASCII -LiteralPath (Join-Path $out 'BUILD-MANIFEST.txt')
          Write-Host "Certified keryxd SHA256: $hash"

      - name: Upload certified Phase 3 real-test package
        uses: actions/upload-artifact@v4
        with:
          name: keryx-ibd-v2-phase3-realtest
          path: phase3-realtest-artifact
          if-no-files-found: error
          retention-days: 14
