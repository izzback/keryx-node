name: Keryx IBD v2 Phase 5.1 Candidate Windows

on:
  push:
    branches:
      - ibd-v2-phase5-pom-compatible
    paths:
      - '.github/workflows/ibd-v2-phase5.1-candidate-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibd-v2-phase5-1-candidate-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Certify Phase 5.1 PoM planner candidate
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout exact Phase 5.1 functional commit
        uses: actions/checkout@v4
        with:
          ref: d9ba1a27666d9b72f968a04a5ffa796bbf0d1586
          fetch-depth: 0
          clean: true

      - name: Verify exact source
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'd9ba1a27666d9b72f968a04a5ffa796bbf0d1586'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "wrong Phase 5.1 source commit: $actual" }
          $dirty = @(git status --porcelain)
          if ($dirty.Count -ne 0) { throw "source tree is dirty before certification: $($dirty -join '; ')" }
          Write-Host "PHASE5_1_FUNCTIONAL_COMMIT=$actual"

      - name: Install protoc 29.6
        run: |
          $ErrorActionPreference = 'Stop'
          $protocVersion = '29.6'
          $archive = Join-Path $env:RUNNER_TEMP "protoc-$protocVersion-phase51.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "protoc-$protocVersion-phase51"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$protocVersion/protoc-$protocVersion-win64.zip"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $protocBin = Join-Path $installDir 'bin'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$protocBin`r`n", $utf8NoBom)
          & (Join-Path $protocBin 'protoc.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'protoc version check failed' }

      - name: Install Rust 1.93.0 natively
        run: |
          $ErrorActionPreference = 'Stop'
          $rustRoot = Join-Path $env:RUNNER_TEMP 'rust-1.93.0-phase51'
          $cargoHome = Join-Path $rustRoot 'cargo'
          $rustupHome = Join-Path $rustRoot 'rustup'
          $rustupInit = Join-Path $env:RUNNER_TEMP 'rustup-init-phase51.exe'
          $rustupUrl = 'https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe'
          if (Test-Path $rustRoot) { Remove-Item $rustRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $rustRoot -Force | Out-Null
          Invoke-WebRequest -Uri $rustupUrl -OutFile $rustupInit -UseBasicParsing
          $env:CARGO_HOME = $cargoHome
          $env:RUSTUP_HOME = $rustupHome
          & $rustupInit -y --no-modify-path --profile minimal --default-host x86_64-pc-windows-msvc --default-toolchain 1.93.0
          if ($LASTEXITCODE -ne 0) { throw 'rustup-init failed' }
          $cargoBin = Join-Path $cargoHome 'bin'
          & (Join-Path $cargoBin 'rustup.exe') component add rustfmt clippy --toolchain 1.93.0-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'rustup component install failed' }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "CARGO_HOME=$cargoHome`r`nRUSTUP_HOME=$rustupHome`r`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$cargoBin`r`n", $utf8NoBom)
          & (Join-Path $cargoBin 'rustc.exe') --version --verbose
          & (Join-Path $cargoBin 'cargo.exe') --version

      - name: Verify formatting and diff hygiene
        run: |
          $ErrorActionPreference = 'Stop'
          rustfmt --edition 2024 --check --config skip_children=true protocol/flows/src/ibd_v2/mod.rs
          if ($LASTEXITCODE -ne 0) { throw 'ibd_v2 mod rustfmt failed' }
          rustfmt --edition 2024 --check protocol/flows/src/ibd_v2/pom_plan.rs
          if ($LASTEXITCODE -ne 0) { throw 'PoM planner rustfmt failed' }

          $parent = '890d28e1823e09d9c394708a00b2a6d535b47be7'
          git diff --check "$parent..HEAD"
          if ($LASTEXITCODE -ne 0) { throw 'Phase 5.1 diff check failed' }
          $expectedFiles = @(
            'protocol/flows/src/ibd_v2/mod.rs',
            'protocol/flows/src/ibd_v2/pom_plan.rs'
          )
          $actualFiles = @(git diff --name-only "$parent..HEAD")
          $unexpected = @($actualFiles | Where-Object { $_ -notin $expectedFiles })
          if ($unexpected.Count -ne 0) { throw "unexpected Phase 5.1 files: $($unexpected -join ', ')" }
          foreach ($file in $expectedFiles) {
            if ($file -notin $actualFiles) { throw "expected Phase 5.1 file missing: $file" }
          }

      - name: Compile touched crate and node consumer
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check -p keryx-p2p-flows --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'p2p-flows check failed' }
          cargo check -p keryxd --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'keryxd check failed' }

      - name: Clippy touched crate
        run: |
          $ErrorActionPreference = 'Stop'
          cargo clippy -p keryx-p2p-flows --all-targets --no-deps -- -D warnings -A clippy::type-complexity -A clippy::collapsible-if
          if ($LASTEXITCODE -ne 0) { throw 'p2p-flows Clippy failed' }

      - name: Run Phase 5.1 and IBD v2 regressions
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test -p keryx-p2p-flows ibd_v2::pom_plan
          if ($LASTEXITCODE -ne 0) { throw 'Phase 5.1 PoM planner tests failed' }
          cargo test -p keryx-p2p-flows ibd_v2
          if ($LASTEXITCODE -ne 0) { throw 'IBD v2 regression tests failed' }

      - name: Verify source remained clean
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(git status --porcelain)
          if ($dirty.Count -ne 0) { throw "source tree changed during certification: $($dirty -join '; ')" }
