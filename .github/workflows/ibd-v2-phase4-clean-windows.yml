name: Keryx IBD v2 Phase 4.2 Clean Windows

# Reproducible certification of the already-published Phase 4.2 functional commit.
# Project policy: local/self-hosted Windows runner only.

on:
  push:
    branches:
      - ibd-v2-phase4-db-batching
    paths:
      - '.github/workflows/ibd-v2-phase4-clean-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibd-v2-phase4-clean-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-certify:
    name: Clean certify Phase 4.2 functional commit
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout exact Phase 4.2 functional commit
        uses: actions/checkout@v4
        with:
          ref: 37801a265330f1131eabf07ff1d7b48c231fffa6
          fetch-depth: 0
          clean: true

      - name: Verify exact clean source tree
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '37801a265330f1131eabf07ff1d7b48c231fffa6'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "wrong Phase 4.2 source commit: $actual" }
          $dirty = @(git status --porcelain --untracked-files=no)
          if ($dirty.Count -ne 0) { throw "tracked source tree is dirty before certification: $($dirty -join '; ')" }
          Write-Host "PHASE4_2_FUNCTIONAL_COMMIT=$actual"

      - name: Install protoc 29.6
        run: |
          $ErrorActionPreference = 'Stop'
          $protocVersion = '29.6'
          $archive = Join-Path $env:RUNNER_TEMP "protoc-$protocVersion-phase42-clean-win64.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "protoc-$protocVersion-phase42-clean"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$protocVersion/protoc-$protocVersion-win64.zip"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $protocBin = Join-Path $installDir 'bin'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$protocBin`r`n", $utf8NoBom)
          & (Join-Path $protocBin 'protoc.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'protoc version check failed' }

      - name: Install Rust 1.93.0 natively
        run: |
          $ErrorActionPreference = 'Stop'
          $rustRoot = Join-Path $env:RUNNER_TEMP 'rust-1.93.0-phase42-clean'
          $cargoHome = Join-Path $rustRoot 'cargo'
          $rustupHome = Join-Path $rustRoot 'rustup'
          $rustupInit = Join-Path $env:RUNNER_TEMP 'rustup-init-phase42-clean.exe'
          $rustupUrl = 'https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe'
          if (Test-Path $rustRoot) { Remove-Item $rustRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $rustRoot -Force | Out-Null
          Invoke-WebRequest -Uri $rustupUrl -OutFile $rustupInit -UseBasicParsing
          $env:CARGO_HOME = $cargoHome
          $env:RUSTUP_HOME = $rustupHome
          & $rustupInit -y --no-modify-path --profile minimal --default-host x86_64-pc-windows-msvc --default-toolchain 1.93.0
          if ($LASTEXITCODE -ne 0) { throw 'rustup-init failed' }
          $cargoBin = Join-Path $cargoHome 'bin'
          & (Join-Path $cargoBin 'rustup.exe') component add rustfmt clippy --toolchain 1.93.0-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'rustup component install failed' }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "CARGO_HOME=$cargoHome`r`nRUSTUP_HOME=$rustupHome`r`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$cargoBin`r`n", $utf8NoBom)
          & (Join-Path $cargoBin 'rustc.exe') --version --verbose
          & (Join-Path $cargoBin 'cargo.exe') --version

      - name: Verify Phase 4.2 formatting and diff hygiene
        run: |
          $ErrorActionPreference = 'Stop'
          rustfmt --edition 2024 --check --config skip_children=true consensus/core/src/api/mod.rs
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt check failed for consensus/core/src/api/mod.rs' }
          rustfmt --edition 2024 --check --config skip_children=true consensus/src/consensus/mod.rs
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt check failed for consensus/src/consensus/mod.rs' }
          foreach ($file in @('components/consensusmanager/src/session.rs', 'protocol/flows/src/ibd/flow.rs')) {
            rustfmt --edition 2024 --check $file
            if ($LASTEXITCODE -ne 0) { throw "rustfmt check failed for $file" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

      - name: Compile Phase 4.2 targets
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check -p keryx-consensus-core --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'consensus-core check failed' }
          cargo check -p keryx-consensus --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'consensus check failed' }
          cargo check -p keryx-consensusmanager --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'consensusmanager check failed' }
          cargo check -p keryx-p2p-flows --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'p2p-flows check failed' }
          cargo check -p keryxd --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'keryxd check failed' }

      - name: Clippy Phase 4.2 touched consumers
        run: |
          $ErrorActionPreference = 'Stop'
          cargo clippy -p keryx-consensusmanager --all-targets --no-deps -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'consensusmanager Clippy failed' }
          # v1.5.6 baseline: p2p-flows has existing type_complexity/collapsible_if findings in
          # flow_context.rs and v7/blockrelay. Keep all other warnings fatal.
          cargo clippy -p keryx-p2p-flows --all-targets --no-deps -- -D warnings -A clippy::type-complexity -A clippy::collapsible-if
          if ($LASTEXITCODE -ne 0) { throw 'p2p-flows Clippy failed' }

      - name: Run Phase 4.2 regressions
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test -p keryx-p2p-flows ibd_v2
          if ($LASTEXITCODE -ne 0) { throw 'IBD v2 regression tests failed' }
          cargo test -p keryx-consensus pruning_point_utxo_import_replay_is_idempotent
          if ($LASTEXITCODE -ne 0) { throw 'UTXO replay regression failed' }

      - name: Guard Phase 4.2 integrations
        run: |
          $ErrorActionPreference = 'Stop'
          $flow = [IO.File]::ReadAllText((Resolve-Path 'protocol/flows/src/ibd/flow.rs'))
          foreach ($needle in @('decode_pom_proof', 'pom_proof_min_daa', 'ServiceStateRecovery', 'UtxoRecovery', 'IbdStageTracker', 'get_missing_block_body_hashes_batch', 'async_get_headers')) {
            if (-not $flow.Contains($needle)) { throw "Phase 4.2 / v1.5.6 guard lost: $needle" }
          }
          if (([regex]::Matches($flow, 'async_get_headers\(')).Count -ne 2) {
            throw 'Phase 4.2 must contain exactly two body-sync async_get_headers calls'
          }
          if ($flow.Contains('TODO (relaxed): make header queries in a batch.')) {
            throw 'old per-block header batching TODO is still present'
          }
          $api = [IO.File]::ReadAllText((Resolve-Path 'consensus/core/src/api/mod.rs'))
          if (-not $api.Contains('fn get_headers(&self, hashes: Vec<Hash>)')) { throw 'ConsensusApi get_headers guard missing' }
          $session = [IO.File]::ReadAllText((Resolve-Path 'components/consensusmanager/src/session.rs'))
          if (-not $session.Contains('pub async fn async_get_headers')) { throw 'async_get_headers session guard missing' }

      - name: Build release node
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release -p keryxd
          if ($LASTEXITCODE -ne 0) { throw 'release build failed' }
          $dirty = @(git status --porcelain --untracked-files=no)
          if ($dirty.Count -ne 0) { throw "tracked source tree changed during clean certification: $($dirty -join '; ')" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'target\release\keryxd.exe').Hash.ToLowerInvariant()
          Write-Host "keryxd.exe SHA256=$hash"

      - name: Package canonical Phase 4.2 node
        run: |
          $ErrorActionPreference = 'Stop'
          $phase41 = 'c1e69e56154fe7f762856aaa8f7e5dce6261d673'
          $phase42 = '37801a265330f1131eabf07ff1d7b48c231fffa6'
          $out = Join-Path $PWD 'ibd-v2-phase42-clean-artifact'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item 'target\release\keryxd.exe' (Join-Path $out 'keryxd.exe')
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'target\release\keryxd.exe').Hash.ToLowerInvariant()
          @(
            'project=Keryx IBD V2 Phase 4.2',
            'upstream_version=1.5.6',
            'official_upstream_commit=a8e23793363c509325881f6146176f39bf52f77f',
            'ibd_v2_v156_base=5cf2a494c1a54348f51fb560928fe473fdef08a4',
            "phase4_1_functional_commit=$phase41",
            "phase4_2_functional_commit=$phase42",
            'certification=clean-exact-commit',
            'runner=Keryx-Node-Windows-01',
            "keryxd_sha256=$hash"
          ) | Set-Content -Encoding ASCII -LiteralPath (Join-Path $out 'BUILD-MANIFEST.txt')

      - name: Upload canonical Phase 4.2 node
        uses: actions/upload-artifact@v4
        with:
          name: keryx-ibd-v2-phase4.2-clean-37801a265330f1131eabf07ff1d7b48c231fffa6
          path: ibd-v2-phase42-clean-artifact
          if-no-files-found: error
          retention-days: 14
