name: IBD V2 Candidate Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - ibd-v2-dev
    paths:
      - '.github/workflows/ibd-v2-ledger-snapshot-candidate.yml'

permissions:
  contents: read

env:
  IBD_V2_CANDIDATE_SHA: 663db294e16edf9cd8fd0af3cd0a44f3abebcf09
  IBD_V2_STABLE_SHA: ad3d8cc0be07909a2a0bebb37c525ddad21fe559

jobs:
  qualify-ibd-v2-dev:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 150
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout qualification trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Enforce branch, candidate and CI-only ancestry
        run: |
          $ErrorActionPreference = 'Stop'
          $source = $env:IBD_V2_CANDIDATE_SHA
          $stable = $env:IBD_V2_STABLE_SHA
          if ($env:GITHUB_REF_NAME -ne 'ibd-v2-dev') { throw 'qualification must run from ibd-v2-dev' }
          git fetch origin ibd-v2-stable ibd-v2-dev
          if ($LASTEXITCODE -ne 0) { throw 'branch fetch failed' }
          $stableRemote = (git rev-parse origin/ibd-v2-stable).Trim()
          $devRemote = (git rev-parse origin/ibd-v2-dev).Trim()
          if ($stableRemote -ne $stable) { throw "stable moved: $stableRemote" }
          if ((git rev-parse "$source^").Trim() -ne $stable) { throw 'candidate parent is not pinned stable' }
          git merge-base --is-ancestor $source $devRemote
          if ($LASTEXITCODE -ne 0) { throw 'candidate is not an ancestor of ibd-v2-dev' }
          $nonCi = @(git diff --name-only "$source..$devRemote" | Where-Object { $_ -notlike '.github/workflows/*' })
          if ($nonCi.Count -ne 0) { throw "non-CI changes exist after candidate: $($nonCi -join ', ')" }
          git checkout --detach $source
          if ($LASTEXITCODE -ne 0) { throw 'candidate checkout failed' }
          if ((git rev-parse HEAD).Trim() -ne $source) { throw 'wrong candidate checkout' }
          if (@(git status --porcelain).Count -ne 0) { throw 'dirty candidate checkout' }

      - name: Prepare qualification evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'ibd-v2-qualification'
          if (Test-Path $evidence) { Remove-Item $evidence -Recurse -Force }
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $evidence 'source-commit.txt') -Value $env:IBD_V2_CANDIDATE_SHA -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $evidence 'stable-parent.txt') -Value $env:IBD_V2_STABLE_SHA -Encoding ASCII

      - name: Install protoc 29.6
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '29.6'
          $archive = Join-Path $env:RUNNER_TEMP "protoc-$v-ibd-v2.zip"
          $dir = Join-Path $env:RUNNER_TEMP "protoc-$v-ibd-v2"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$v/protoc-$v-win64.zip"
          & curl.exe -fL --retry 5 --retry-delay 2 --retry-all-errors $url -o $archive
          if ($LASTEXITCODE -ne 0) { throw 'protoc download failed' }
          Expand-Archive -LiteralPath $archive -DestinationPath $dir -Force
          $bin = Join-Path $dir 'bin'
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$bin`r`n", (New-Object Text.UTF8Encoding($false)))
          & (Join-Path $bin 'protoc.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'protoc check failed' }

      - name: Install Rust 1.93
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'rust-1.93-ibd-v2'
          $cargoHome = Join-Path $root 'cargo'
          $rustupHome = Join-Path $root 'rustup'
          $init = Join-Path $env:RUNNER_TEMP 'rustup-init-ibd-v2.exe'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Invoke-WebRequest -Uri 'https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe' -OutFile $init -UseBasicParsing
          $env:CARGO_HOME = $cargoHome
          $env:RUSTUP_HOME = $rustupHome
          & $init -y --no-modify-path --profile minimal --default-host x86_64-pc-windows-msvc --default-toolchain 1.93.0
          if ($LASTEXITCODE -ne 0) { throw 'rustup-init failed' }
          $bin = Join-Path $cargoHome 'bin'
          & (Join-Path $bin 'rustup.exe') component add rustfmt clippy --toolchain 1.93.0-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'rust components failed' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "CARGO_HOME=$cargoHome`r`nRUSTUP_HOME=$rustupHome`r`n", (New-Object Text.UTF8Encoding($false)))
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$bin`r`n", (New-Object Text.UTF8Encoding($false)))

      - name: Verify exact functional diff
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = $env:IBD_V2_STABLE_SHA
          $source = $env:IBD_V2_CANDIDATE_SHA
          $expected = @(
            'components/consensusmanager/src/session.rs',
            'consensus/core/src/api/mod.rs',
            'consensus/core/src/collateral.rs',
            'consensus/core/src/config/params.rs',
            'consensus/core/src/errors/block.rs',
            'consensus/src/bin/dump_service_state.rs',
            'consensus/src/consensus/mod.rs',
            'consensus/src/consensus/storage.rs',
            'consensus/src/model/stores/mod.rs',
            'consensus/src/model/stores/service_ledger_snapshot.rs',
            'consensus/src/pipeline/virtual_processor/processor.rs',
            'consensus/src/pipeline/virtual_processor/service_bond.rs',
            'consensus/src/pipeline/virtual_processor/tests.rs',
            'consensus/src/pipeline/virtual_processor/utxo_validation.rs',
            'consensus/src/processes/pruning.rs',
            'database/src/registry.rs'
          ) | Sort-Object
          $actual = @(git diff --name-only "$parent..$source") | Sort-Object
          if ($actual.Count -ne $expected.Count -or (Compare-Object $actual $expected)) { throw "unexpected candidate files: $($actual -join ', ')" }
          git diff --check "$parent..$source"
          if ($LASTEXITCODE -ne 0) { throw 'candidate diff check failed' }

      - name: Baseline-aware formatting on changed Rust files
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = $env:IBD_V2_STABLE_SHA
          $source = $env:IBD_V2_CANDIDATE_SHA
          $parentTree = Join-Path $env:RUNNER_TEMP 'ibd-v2-format-parent-worktree'
          if (Test-Path $parentTree) { Remove-Item $parentTree -Recurse -Force }
          git worktree prune
          git worktree add --detach $parentTree $parent
          if ($LASTEXITCODE -ne 0) { throw 'failed to create parent worktree for rustfmt baseline' }
          try {
            $changedRust = @(git diff --name-only "$parent..$source" -- '*.rs')
            foreach ($path in $changedRust) {
              rustfmt --edition 2024 --check --config skip_children=true $path 2>$null
              $candidateStatus = $LASTEXITCODE
              if ($candidateStatus -eq 0) { continue }

              $parentPath = Join-Path $parentTree ($path -replace '/', [IO.Path]::DirectorySeparatorChar)
              if (-not (Test-Path -LiteralPath $parentPath)) {
                throw "new Rust file fails rustfmt: $path"
              }

              rustfmt --edition 2024 --check --config skip_children=true $parentPath 2>$null
              $parentStatus = $LASTEXITCODE
              if ($parentStatus -eq 0) {
                throw "new rustfmt regression introduced by candidate: $path"
              }
              Write-Warning "confirmed inherited rustfmt debt in $path"
            }
          } finally {
            git worktree remove --force $parentTree
          }
          if (@(git status --porcelain).Count -ne 0) { throw 'format checks dirtied source tree' }

      - name: Compile exact source
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check -p keryx-consensus-core --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'consensus-core compile failed' }
          cargo check -p keryx-consensus --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'consensus compile failed' }
          cargo check -p keryxd --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'keryxd compile failed' }

      - name: Strict Clippy outside confirmed baseline
        run: |
          $ErrorActionPreference = 'Stop'
          cargo clippy -p keryx-consensus --all-targets --no-deps -- -D warnings `
            -A clippy::type-complexity `
            -A clippy::collapsible-if `
            -A clippy::empty-line-after-doc-comments `
            -A clippy::nonminimal-bool `
            -A clippy::manual-div-ceil `
            -A clippy::manual-is-multiple-of `
            -A clippy::items-after-test-module `
            -A clippy::useless-conversion `
            -A clippy::needless-range-loop `
            -A clippy::needless-borrows-for-generic-args
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed outside confirmed baseline' }

      - name: Run targeted snapshot and IBD regressions with execution proof
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'ibd-v2-qualification'

          function Invoke-ExactListedTest {
            param(
              [Parameter(Mandatory=$true)][string]$Package,
              [Parameter(Mandatory=$true)][string]$Filter,
              [Parameter(Mandatory=$true)][string]$Label
            )
            $listOutput = @(& cargo test -p $Package --color never -- --list 2>&1)
            $listExit = $LASTEXITCODE
            $listOutput | Tee-Object -FilePath (Join-Path $evidence "$Filter-list.log") | ForEach-Object { Write-Host $_ }
            if ($listExit -ne 0) { throw "$Label test listing failed" }
            $matches = @($listOutput | Where-Object { $_.ToString().Trim().EndsWith("$Filter`: test") })
            if ($matches.Count -ne 1) { throw "$Label expected exactly one listed test ending in '$Filter: test', found $($matches.Count)" }
            $fullName = $matches[0].ToString().Trim() -replace ': test$', ''
            $testOutput = @(& cargo test -p $Package --color never $fullName -- --exact --nocapture 2>&1)
            $testExit = $LASTEXITCODE
            $testOutput | Tee-Object -FilePath (Join-Path $evidence "$Filter-run.log") | ForEach-Object { Write-Host $_ }
            if ($testExit -ne 0) { throw "$Label failed" }
            $proofLine = "test $fullName ... ok"
            $proofCount = @($testOutput | Where-Object { $_.ToString().Trim() -eq $proofLine }).Count
            if ($proofCount -ne 1) { throw "$Label execution proof missing or ambiguous; expected one '$proofLine', found $proofCount" }
            Add-Content -LiteralPath (Join-Path $evidence 'execution-proofs.txt') -Value "EXECUTION_PROOF $Label => $proofLine" -Encoding UTF8
          }

          Invoke-ExactListedTest -Package 'keryx-consensus' -Filter 'ibd_body_without_proof_is_paid_by_its_header_tier' -Label 'proofless IBD tier regression'
          Invoke-ExactListedTest -Package 'keryx-consensus' -Filter 'service_state_check_skips_pruning_points_below_the_snapshot_floor' -Label 'snapshot floor regression'
          Invoke-ExactListedTest -Package 'keryx-consensus' -Filter 'assert_pruning_depth_consistency' -Label 'pruning/genesis parameter regression'

          cargo test -p keryx-consensus service_ledger
          if ($LASTEXITCODE -ne 0) { throw 'consensus service-ledger regressions failed' }
          cargo test -p keryx-consensus-core service_ledger
          if ($LASTEXITCODE -ne 0) { throw 'consensus-core service-ledger regressions failed' }
          cargo test -p keryx-consensus tier_reward
          if ($LASTEXITCODE -ne 0) { throw 'tier reward regression failed' }
          if (@(git status --porcelain).Count -ne 0) { throw 'tests dirtied source tree' }

      - name: Record certified functional SHA
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:IBD_V2_CANDIDATE_SHA) { throw 'certified checkout moved' }
          $evidence = Join-Path $env:RUNNER_TEMP 'ibd-v2-qualification'
          Set-Content -LiteralPath (Join-Path $evidence 'certified-functional-sha.txt') -Value $env:IBD_V2_CANDIDATE_SHA -Encoding ASCII

      - name: Archive qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibd-v2-qualification-${{ env.IBD_V2_CANDIDATE_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}\ibd-v2-qualification
          if-no-files-found: warn
